[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true


[workspace.package]
version = "0.1.0"
authors = ["VaibhavArora19"]
edition = "2024"
rust-version = "1.88"
license = "MIT or Apache-2.0"
publish = false

[workspace]
members = ["crates/*", "bin/*"]
resolver = "3"

[workspace.dependencies]
tokio-cron-scheduler = "0.15.1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
nanoid = "0.4.0"
thiserror = "2.0.17"
serde_json = "1"
futures-util = "0.3"
tracing = "0.1"
dotenv = "0.15.0"
axum = "0.8.8"
governor = "0.7"
once_cell = "1.20"
base64 = "0.22.1"
bincode = "1.3"
serde_with = "3.16.1"
solana-transaction = "2.2.1"
solana-keypair = "2.2.1"
solana-commitment-config = "2.2.1"
solana-rpc-client = "2.2.1"
solana-rpc-client-api = "2.2.1"
solana-instruction = "2.2.1"
solana-pubkey = "2.2.1"
solana-message = "2.2.1"
solana-signer = "2.2.1"
solana-signature = "2.2.1"
solana-address-lookup-table-interface = { version = "2.2.1", features = ["bincode", "bytemuck"] }
async-trait = "0.1"
rmp-serde = "1.3"

validator = { version = "0.19", features = ["derive"] }
uuid = { version = "1.13.1", features = ["v4", "serde"] }
serde = { version = "1", features = ["derive"] }
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4.28", features = ["kv_serde"]}
tracing-subscriber = "0.3.22"
refinery = { version = "0.8.16", features = ["postgres"] }
refinery-core = { version = "0.8.16" }
sqlx = { version = "0.6", features = [
	"postgres",
	"runtime-tokio-rustls",
     "macros", "chrono", "uuid"
] }
tower-http = { version = "0.6", features = ["cors", "limit"] }
spl-associated-token-account-client = "2.0.0"
alloy = { version = "1.0", features = ["sol-types", "contract", "provider-http", "rpc-types"] }
reqwest = { version = "0.12", features = ["json"] }
cargo-husky = { version = "1.5.0", default-features = false, features = ["prepush-hook", "run-cargo-clippy", "run-cargo-fmt"] }
jsonwebtoken = "9.3.0"
p256 = { version = "0.13", features = ["ecdsa"] }
hex = "0.4"


perp_core = { path = "crates/core" }

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
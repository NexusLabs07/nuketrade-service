[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true


[workspace.package]
version = "0.1.0"
authors = ["VaibhavArora19"]
edition = "2024"
rust-version = "1.88"
license = "MIT or Apache-2.0"
publish = false

[workspace]
members = ["crates/*", "bin/*"]
resolver = "3"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
futures-util = "0.3"
anyhow = "1"
core = { path = "../core" }
chrono = "0.4"
log = { version = "0.4.28", features = ["kv_serde"]}
tracing-subscriber = "0.3.22"

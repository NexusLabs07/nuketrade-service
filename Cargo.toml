[profile.release]
opt-level = 3
strip = true
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true


[workspace.package]
version = "0.1.0"
authors = ["VaibhavArora19"]
edition = "2024"
rust-version = "1.88"
license = "MIT or Apache-2.0"
publish = false

[workspace]
members = ["crates/*", "bin/*"]
resolver = "3"

[workspace.dependencies]
uuid = { version = "1.13.1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2.0.17"
serde_json = "1"
tokio-tungstenite = { version = "0.28.0", features = ["native-tls"] }
futures-util = "0.3"
anyhow = "1"
core = { path = "../core" }
chrono = { version = "0.4", features = ["serde"] }
log = { version = "0.4.28", features = ["kv_serde"]}
tracing = "0.1"
tracing-subscriber = "0.3.22"
refinery = { version = "0.8.16", features = ["postgres"] }
dotenv = "0.15.0"
axum = "0.8.8"
sqlx = { version = "0.6", features = [
	"postgres",
	"runtime-tokio-rustls",
     "macros", "chrono", "uuid"
] }
nanoid = "0.4.0"
validator = { version = "0.19", features = ["derive"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "limit"] }
governor = "0.7"
once_cell = "1.20"
base64 = "0.22.1"
serde_with = "3.16.1"
solana-transaction = "2.2.1"
solana-keypair = "2.2.1"
solana-rpc-client = "2.2.1"
solana-instruction = "2.2.1"
solana-pubkey = "2.2.1"
spl-associated-token-account-client = "2.0.0"